spring.application.name=api-gateway

server.port=8082

eureka.client.service-url.defaultZone=http://localhost:8080/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true


# These properties belong to the WebMVC gateway starter
# (spring-cloud-starter-gateway-server-webmvc).
# StripPrefix removes the service-name segment before forwarding.

# Driver Service Route
spring.cloud.gateway.server.webmvc.routes[0].id=driver-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://driver-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/driver-service/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=1

# Rider Service Route
spring.cloud.gateway.server.webmvc.routes[1].id=rider-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://rider-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/rider-service/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=1


#Ride Service Route
# Ride Service Route
spring.cloud.gateway.server.webmvc.routes[2].id=ride-service
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://ride-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/ride-service/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=1

#razorpay route
spring.cloud.gateway.server.webmvc.routes[3].id=payment-service
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://payment-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/payment-service/**
spring.cloud.gateway.server.webmvc.routes[3].filters[0]=StripPrefix=1